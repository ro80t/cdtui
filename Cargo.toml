[workspace]
members = ["packages/*"]
resolver = "3"

# Publish metadata inherited by every crate. crates.io requires version,
# description and license; description is written per crate.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"  # ratatui 0.30 and ignore 0.4.33 both require 1.88
license = "MIT"
authors = ["ro80t"]
repository = "https://github.com/ro80t/cdt"
homepage = "https://github.com/ro80t/cdt"
keywords = ["cli", "tui", "cd", "filesystem", "ripgrep"]
categories = ["command-line-utilities", "filesystem"]

# A path-only dependency cannot be published. With a version alongside it,
# crates.io uses the version and local builds use the path.
[workspace.dependencies]
ignore = "0.4.33"
ratatui = "0.30.2"
cdt-tree = { path = "packages/cdt-tree", version = "0.1.0" }
cdt-search = { path = "packages/cdt-search", version = "0.1.0" }
cdt-view = { path = "packages/cdt-view", version = "0.1.0" }

[profile.release]
strip = true
