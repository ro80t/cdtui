# Published as cdtui: the name `cdt` is already taken on crates.io. Binary
# names are exempt from that uniqueness constraint, so the command stays `cdt`,
# which is just cdtui abbreviated.
[package]
name = "cdtui"
# Both bins are the same program, so `cargo run` should not have to be told
# which one: without this it fails with "could not determine which binary".
default-run = "cdt"
description = "A neo-tree style terminal UI for cd-ing around a directory tree, with ripgrep search."
keywords = ["cd", "tui", "ripgrep", "navigation", "shell"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
readme = "../../README.md"

# Both commands are auto-discovered from src/bin/: `cdt` (short, the one you
# type) and `cdtui` (matches the crate name). Each is a one-line call into the
# lib, so neither is a second copy of the logic.

[dependencies]
cdt-view.workspace = true

# Already in the tree via ratatui/crossterm, so this adds no download or build:
# it is only needed to read the parent process, which is the one reliable way
# to tell which shell asked for `--init`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
] }
